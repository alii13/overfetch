schema_version: "1.1"
name: analyzes-har-capture
expected_outcome: |
  analysis.md identifies, from the capture alone: the 20-read per-row burst on
  /api/v1/agents/{id} (recommend a batch read, and note the batch
  request already present in the capture as the shape to use); two interleaved
  60 s timers on GET /v1/billing/summary (effective 30 s; keep one poller); the
  three copies of GET /api/v1/workspaces within 2 s (two overlapping); the
  serial chain me -> orgs -> org settings -> flags (parallelise after confirming
  independence); the 404 on the eval dataset repeated four times (retry on a
  read that cannot succeed). It must not call the third POST /v1/search a
  duplicate (its body differs) and must exclude the three static assets from the
  API count (49 API requests). It should say what cannot be concluded without
  the source.
context:
  scaffold_script: place-files.sh
